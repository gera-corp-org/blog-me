apiVersion: v1
kind: ConfigMap
metadata:
  name: blog-config
data:
  SITE_URL: "https://blog.example.com"
  SITE_TITLE: "Блог"
  SITE_DESCRIPTION: "Личные записи"
  SITE_AUTHOR: "Гера"
  # Ingress стоит в частной сети кластера, поэтому его заголовку с адресом
  # посетителя можно верить. Без этого адресом каждого посетителя окажется
  # адрес самого ingress, и ограничение попыток входа станет общим на всех.
  TRUST_PROXY: "loopback,uniquelocal"
  POSTS_PER_PAGE: "10"
  SESSION_TTL_DAYS: "30"
  COOKIE_SECURE: "true"
  UPLOAD_MAX_BYTES: "10485760"
  BACKUP_KEEP: "7"
